# OpenCode Go endpoint; "env:NAME" values are read from the environment by loader.load_agent_models
agents:
  text_inspector:
    model_class: LiteLLMModel
    model_id: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: env:OPENCODE_API_KEY
    max_tokens: 8192
  visual_qa:            # needs an image-capable model (Go /models: modalities.input contains "image")
    model_class: LiteLLMModel
    model_id: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: env:OPENCODE_API_KEY
    max_tokens: 1500
  reformulator:
    model_class: LiteLLMModel
    model_id: openai/deepseek-v4.1-flash
    api_base: https://opencode.ai/zen/go/v1
    api_key: env:OPENCODE_API_KEY
    max_tokens: 4096
